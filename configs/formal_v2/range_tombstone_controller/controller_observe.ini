# Formal V2 observability control. It shares the controller candidate's
# thresholds but never requests a flush; INFO logs document would-flush
# decisions while the event CSV remains free of controller flushes.
exp_id=rtc_controller_observe
group_name=RTC-CONTROLLER-OBSERVE
desc=Formal V2 range tombstone controller observe-only control
trace_dir=/home/wam/grad/s14-range-delete-study/traces/formal_v2/small_dynamic_500k_limit
total_keys=500000
value_size=256
num_workers=8
random_seed=90001

memtable_max_range_deletions=0
memtable_op_scan_flush_trigger=0
enable_range_tombstone_controller=true
range_tombstone_controller_observe_only=true
range_tombstone_controller_min_range_deletions=512
range_tombstone_controller_min_memtable_bytes=8388608
range_tombstone_controller_cooldown_micros=1000000

write_buffer_size=67108864
max_write_buffer_number=4
level0_file_num_compaction_trigger=4
level0_slowdown_writes_trigger=8
level0_stop_writes_trigger=12
block_cache_size=134217728
target_file_size_base=67108864
max_bytes_for_level_base=268435456
max_background_jobs=8
