<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="350" style="background:#0f172a; font-family:sans-serif;">
      <text x="450" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">S1: Static Tombstone Read Cost Isolation (Clean vs Tombstone)</text>
      
      <!-- Panel 1: Scan Normalized Cost -->
      <g transform="translate(50, 60)">
        <rect width="240" height="240" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="120" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Scan Cost (μs/key)</text>
        <line x1="30" y1="200" x2="220" y2="200" stroke="#64748b"/>
        <!-- Bars (scale max 3.0) -->
        <rect x="40" y="67.7" width="35" height="132.3" fill="#38bdf8" rx="3"/>
        <text x="57" y="57.7" fill="#f8fafc" font-size="10" text-anchor="middle">2.21</text>
        <text x="57" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Clean-Pt</text>

        <rect x="85" y="66.8" width="35" height="133.2" fill="#f43f5e" rx="3"/>
        <text x="102" y="56.8" fill="#f8fafc" font-size="10" text-anchor="middle">2.22</text>
        <text x="102" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Tomb-Pt</text>

        <rect x="130" y="83.5" width="35" height="116.5" fill="#38bdf8" rx="3"/>
        <text x="147" y="73.5" fill="#f8fafc" font-size="10" text-anchor="middle">1.94</text>
        <text x="147" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Clean-Sc</text>

        <rect x="175" y="75.3" width="35" height="124.7" fill="#f43f5e" rx="3"/>
        <text x="192" y="65.3" fill="#f8fafc" font-size="10" text-anchor="middle">2.08</text>
        <text x="192" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Tomb-Sc</text>
      </g>

      <!-- Panel 2: Get Control P99 -->
      <g transform="translate(330, 60)">
        <rect width="240" height="240" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="120" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Get (Control) P99 (μs)</text>
        <line x1="30" y1="200" x2="220" y2="200" stroke="#64748b"/>
        <!-- Bars (scale max 35.0) -->
        <rect x="40" y="89.6" width="35" height="110.4" fill="#38bdf8" rx="3"/>
        <text x="57" y="79.6" fill="#f8fafc" font-size="10" text-anchor="middle">22.1</text>
        <text x="57" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Clean-Pt</text>

        <rect x="85" y="87.4" width="35" height="112.6" fill="#f43f5e" rx="3"/>
        <text x="102" y="77.4" fill="#f8fafc" font-size="10" text-anchor="middle">22.5</text>
        <text x="102" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Tomb-Pt</text>

        <rect x="130" y="84.9" width="35" height="115.1" fill="#38bdf8" rx="3"/>
        <text x="147" y="74.9" fill="#f8fafc" font-size="10" text-anchor="middle">23.0</text>
        <text x="147" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Clean-Sc</text>

        <rect x="175" y="63.7" width="35" height="136.3" fill="#f43f5e" rx="3"/>
        <text x="192" y="53.7" fill="#f8fafc" font-size="10" text-anchor="middle">27.3</text>
        <text x="192" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Tomb-Sc</text>
      </g>

      <!-- Panel 3: Cache Misses -->
      <g transform="translate(610, 60)">
        <rect width="240" height="240" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="120" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Cache Misses (Million)</text>
        <line x1="30" y1="200" x2="220" y2="200" stroke="#64748b"/>
        <!-- Bars (scale max 3.5M) -->
        <rect x="40" y="181.9" width="35" height="18.1" fill="#38bdf8" rx="3"/>
        <text x="57" y="171.9" fill="#f8fafc" font-size="10" text-anchor="middle">0.36M</text>
        <text x="57" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Clean-Pt</text>

        <rect x="85" y="171.8" width="35" height="28.2" fill="#f43f5e" rx="3"/>
        <text x="102" y="161.8" fill="#f8fafc" font-size="10" text-anchor="middle">0.56M</text>
        <text x="102" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Tomb-Pt</text>

        <rect x="130" y="80.3" width="35" height="119.7" fill="#38bdf8" rx="3"/>
        <text x="147" y="70.3" fill="#f8fafc" font-size="10" text-anchor="middle">2.39M</text>
        <text x="147" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Clean-Sc</text>

        <rect x="175" y="67.8" width="35" height="132.2" fill="#f43f5e" rx="3"/>
        <text x="192" y="57.8" fill="#f8fafc" font-size="10" text-anchor="middle">2.64M</text>
        <text x="192" y="215" fill="#94a3b8" font-size="9" text-anchor="middle">Tomb-Sc</text>
      </g>
    </svg>