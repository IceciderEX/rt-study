<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="350" style="background:#0f172a; font-family:sans-serif;">
      <text x="400" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">S2: Tombstone Fragmentation Fairness (40% Fixed Coverage)</text>
      
      <!-- Panel 1: Scan Cost -->
      <g transform="translate(60, 60)">
        <rect width="320" height="240" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="160" y="25" fill="#a855f7" font-size="13" font-weight="bold" text-anchor="middle">Scan Cost (μs/key) vs Segments</text>
        <line x1="30" y1="200" x2="290" y2="200" stroke="#64748b"/>

        <!-- seg-20 -->
        <rect x="50" y="32.9" width="28" height="167.1" fill="#38bdf8" rx="2"/>
        <rect x="80" y="49.2" width="28" height="150.8" fill="#ec4899" rx="2"/>
        <text x="79" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">seg-20</text>
        <text x="64" y="22.9" fill="#f8fafc" font-size="9" text-anchor="middle">2.23</text>
        <text x="94" y="39.2" fill="#f8fafc" font-size="9" text-anchor="middle">2.01</text>

        <!-- seg-200 -->
        <rect x="130" y="40.1" width="28" height="159.9" fill="#38bdf8" rx="2"/>
        <rect x="160" y="50.5" width="28" height="149.5" fill="#ec4899" rx="2"/>
        <text x="159" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">seg-200</text>
        <text x="144" y="30.1" fill="#f8fafc" font-size="9" text-anchor="middle">2.13</text>
        <text x="174" y="40.5" fill="#f8fafc" font-size="9" text-anchor="middle">1.99</text>

        <!-- seg-2000 -->
        <rect x="210" y="34.0" width="28" height="166.0" fill="#38bdf8" rx="2"/>
        <rect x="240" y="43.3" width="28" height="156.7" fill="#ec4899" rx="2"/>
        <text x="239" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">seg-2000</text>
        <text x="224" y="24.0" fill="#f8fafc" font-size="9" text-anchor="middle">2.21</text>
        <text x="254" y="33.3" fill="#f8fafc" font-size="9" text-anchor="middle">2.09</text>
      </g>

      <!-- Panel 2: Get Affected P99 -->
      <g transform="translate(420, 60)">
        <rect width="320" height="240" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="160" y="25" fill="#a855f7" font-size="13" font-weight="bold" text-anchor="middle">Get (Affected) P99 (μs) vs Segments</text>
        <line x1="30" y1="200" x2="290" y2="200" stroke="#64748b"/>

        <!-- seg-20 -->
        <rect x="50" y="103.8" width="28" height="96.2" fill="#38bdf8" rx="2"/>
        <rect x="80" y="58.3" width="28" height="141.7" fill="#ec4899" rx="2"/>
        <text x="79" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">seg-20</text>
        <text x="64" y="93.8" fill="#f8fafc" font-size="9" text-anchor="middle">24.1</text>
        <text x="94" y="48.3" fill="#f8fafc" font-size="9" text-anchor="middle">35.4</text>

        <!-- seg-200 -->
        <rect x="130" y="110.6" width="28" height="89.4" fill="#38bdf8" rx="2"/>
        <rect x="160" y="87.0" width="28" height="113.0" fill="#ec4899" rx="2"/>
        <text x="159" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">seg-200</text>
        <text x="144" y="100.6" fill="#f8fafc" font-size="9" text-anchor="middle">22.4</text>
        <text x="174" y="77.0" fill="#f8fafc" font-size="9" text-anchor="middle">28.3</text>

        <!-- seg-2000 -->
        <rect x="210" y="105.9" width="28" height="94.1" fill="#38bdf8" rx="2"/>
        <rect x="240" y="84.1" width="28" height="115.9" fill="#ec4899" rx="2"/>
        <text x="239" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">seg-2000</text>
        <text x="224" y="95.9" fill="#f8fafc" font-size="9" text-anchor="middle">23.5</text>
        <text x="254" y="74.1" fill="#f8fafc" font-size="9" text-anchor="middle">29.0</text>
      </g>
    </svg>