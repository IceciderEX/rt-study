<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="360" style="background:#0f172a; font-family:sans-serif;">
      <text x="480" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">P6: Dynamic Range Deletion Origin Localization (D0 vs D1 vs D2)</text>
      
      <!-- Panel 1: Throughput (kIOPS) -->
      <g transform="translate(40, 60)">
        <rect width="200" height="250" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Main IOPS (kOps/s)</text>
        <line x1="20" y1="210" x2="180" y2="210" stroke="#64748b"/>
        <!-- Bars (scale max 250k) -->
        <rect x="30" y="79.1" width="35" height="130.9" fill="#38bdf8" rx="3"/>
        <text x="47" y="69.1" fill="#f8fafc" font-size="10" text-anchor="middle">174.6k</text>
        <text x="47" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D0</text>

        <rect x="82" y="79.3" width="35" height="130.7" fill="#a855f7" rx="3"/>
        <text x="99" y="69.3" fill="#f8fafc" font-size="10" text-anchor="middle">174.3k</text>
        <text x="99" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D1</text>

        <rect x="135" y="86.5" width="35" height="123.5" fill="#f43f5e" rx="3"/>
        <text x="152" y="76.5" fill="#f8fafc" font-size="10" text-anchor="middle">164.7k</text>
        <text x="152" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D2</text>
      </g>

      <!-- Panel 2: Scan Cost (μs/key) -->
      <g transform="translate(260, 60)">
        <rect width="200" height="250" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Scan Cost (μs/key)</text>
        <line x1="20" y1="210" x2="180" y2="210" stroke="#64748b"/>
        <!-- Bars (scale max 5.0) -->
        <rect x="30" y="109.6" width="35" height="100.4" fill="#38bdf8" rx="3"/>
        <text x="47" y="99.6" fill="#f8fafc" font-size="10" text-anchor="middle">2.87</text>
        <text x="47" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D0</text>

        <rect x="82" y="109.3" width="35" height="100.7" fill="#a855f7" rx="3"/>
        <text x="99" y="99.3" fill="#f8fafc" font-size="10" text-anchor="middle">2.88</text>
        <text x="99" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D1</text>

        <rect x="135" y="120.6" width="35" height="89.4" fill="#f43f5e" rx="3"/>
        <text x="152" y="110.6" fill="#f8fafc" font-size="10" text-anchor="middle">2.55</text>
        <text x="152" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D2</text>
      </g>

      <!-- Panel 3: Get Affected P99 (μs) -->
      <g transform="translate(480, 60)">
        <rect width="200" height="250" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Get (Aff) P99 (μs)</text>
        <line x1="20" y1="210" x2="180" y2="210" stroke="#64748b"/>
        <!-- Bars (scale max 40.0) -->
        <rect x="30" y="109.5" width="35" height="100.5" fill="#38bdf8" rx="3"/>
        <text x="47" y="99.5" fill="#f8fafc" font-size="10" text-anchor="middle">22.3</text>
        <text x="47" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D0</text>

        <rect x="82" y="109.4" width="35" height="100.6" fill="#a855f7" rx="3"/>
        <text x="99" y="99.4" fill="#f8fafc" font-size="10" text-anchor="middle">22.4</text>
        <text x="99" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D1</text>

        <rect x="135" y="106.2" width="35" height="103.8" fill="#f43f5e" rx="3"/>
        <text x="152" y="96.2" fill="#f8fafc" font-size="10" text-anchor="middle">23.1</text>
        <text x="152" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D2</text>
      </g>

      <!-- Panel 4: Final L0 Files -->
      <g transform="translate(700, 60)">
        <rect width="220" height="250" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="110" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Final L0 File Count</text>
        <line x1="20" y1="210" x2="200" y2="210" stroke="#64748b"/>
        <!-- Bars (scale max 10) -->
        <rect x="35" y="210.0" width="35" height="0.0" fill="#38bdf8" rx="3"/>
        <text x="52" y="200.0" fill="#f8fafc" font-size="10" text-anchor="middle">0</text>
        <text x="52" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D0</text>

        <rect x="92" y="210.0" width="35" height="0.0" fill="#a855f7" rx="3"/>
        <text x="109" y="200.0" fill="#f8fafc" font-size="10" text-anchor="middle">0</text>
        <text x="109" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D1</text>

        <rect x="150" y="210.0" width="35" height="0.0" fill="#f43f5e" rx="3"/>
        <text x="167" y="200.0" fill="#f8fafc" font-size="10" text-anchor="middle">0</text>
        <text x="167" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">D2</text>
      </g>
    </svg>