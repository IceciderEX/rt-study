<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="380" style="background:#0f172a; font-family:sans-serif;">
      <text x="480" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">P7: P1 High Degradation Intensity Replay (DeleteRange 0.0% to 10.0%)</text>
      
      <!-- Panel 1: Throughput (kIOPS) -->
      <g transform="translate(40, 60)">
        <rect width="200" height="280" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Throughput (kOps/s)</text>
        <line x1="20" y1="240" x2="180" y2="240" stroke="#64748b"/>
        <!-- Bars (max scale 450k) -->
        <rect x="25" y="47.9" width="20" height="192.1" fill="#38bdf8" rx="2"/><rect x="50" y="78.1" width="20" height="161.9" fill="#06b6d4" rx="2"/><rect x="75" y="183.2" width="20" height="56.8" fill="#10b981" rx="2"/><rect x="100" y="224.5" width="20" height="15.5" fill="#f59e0b" rx="2"/><rect x="125" y="236.6" width="20" height="3.4" fill="#f97316" rx="2"/><rect x="150" y="239.2" width="20" height="0.8" fill="#ef4444" rx="2"/>
        <text x="35" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.0%</text><text x="60" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.5%</text><text x="85" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">1.0%</text><text x="110" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">2.0%</text><text x="135" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">5.0%</text><text x="160" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">10.0%</text>
        <text x="100" y="272" fill="#e2e8f0" font-size="10" text-anchor="middle">427k → 1.8k (234x Drop)</text>
      </g>

      <!-- Panel 2: Scan Cost (μs/key) -->
      <g transform="translate(260, 60)">
        <rect width="200" height="280" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Scan Cost (μs/key)</text>
        <line x1="20" y1="240" x2="180" y2="240" stroke="#64748b"/>
        <!-- Bars (scale max 250) -->
        <rect x="25" y="239.5" width="20" height="0.5" fill="#38bdf8" rx="2"/><rect x="50" y="239.5" width="20" height="0.5" fill="#06b6d4" rx="2"/><rect x="75" y="238.8" width="20" height="1.2" fill="#10b981" rx="2"/><rect x="100" y="236.1" width="20" height="3.9" fill="#f59e0b" rx="2"/><rect x="125" y="216.3" width="20" height="23.7" fill="#f97316" rx="2"/><rect x="150" y="67.9" width="20" height="172.1" fill="#ef4444" rx="2"/>
        <text x="35" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.0%</text><text x="60" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.5%</text><text x="85" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">1.0%</text><text x="110" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">2.0%</text><text x="135" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">5.0%</text><text x="160" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">10.0%</text>
        <text x="100" y="272" fill="#e2e8f0" font-size="10" text-anchor="middle">0.58 → 215.1 μs (371x Cost)</text>
      </g>

      <!-- Panel 3: DeleteRange Operations Count -->
      <g transform="translate(480, 60)">
        <rect width="200" height="280" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="100" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">In-Mem Tombstones Count</text>
        <line x1="20" y1="240" x2="180" y2="240" stroke="#64748b"/>
        <!-- Bars (max 20,000) -->
        <rect x="25" y="240.0" width="20" height="0.0" fill="#38bdf8" rx="2"/><rect x="50" y="230.0" width="20" height="10.0" fill="#06b6d4" rx="2"/><rect x="75" y="220.0" width="20" height="20.0" fill="#10b981" rx="2"/><rect x="100" y="200.0" width="20" height="40.0" fill="#f59e0b" rx="2"/><rect x="125" y="140.0" width="20" height="100.0" fill="#f97316" rx="2"/><rect x="150" y="40.0" width="20" height="200.0" fill="#ef4444" rx="2"/>
        <text x="35" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.0%</text><text x="60" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.5%</text><text x="85" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">1.0%</text><text x="110" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">2.0%</text><text x="135" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">5.0%</text><text x="160" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">10.0%</text>
        <text x="100" y="272" fill="#e2e8f0" font-size="10" text-anchor="middle">Max Tombstones: 20000</text>
      </g>

      <!-- Panel 4: Get Deleted P95 Latency (ms) -->
      <g transform="translate(700, 60)">
        <rect width="220" height="280" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="110" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Get (Deleted) P95 (ms)</text>
        <line x1="20" y1="240" x2="200" y2="240" stroke="#64748b"/>
        <rect x="30" y="240.0" width="20" height="0.0" fill="#38bdf8" rx="2"/><rect x="57" y="240.0" width="20" height="0.0" fill="#06b6d4" rx="2"/><rect x="84" y="238.2" width="20" height="1.8" fill="#10b981" rx="2"/><rect x="111" y="221.7" width="20" height="18.3" fill="#f59e0b" rx="2"/><rect x="138" y="177.6" width="20" height="62.4" fill="#f97316" rx="2"/><rect x="165" y="55.1" width="20" height="184.9" fill="#ef4444" rx="2"/>
        <text x="40" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.0%</text><text x="67" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">0.5%</text><text x="94" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">1.0%</text><text x="121" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">2.0%</text><text x="148" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">5.0%</text><text x="175" y="255" fill="#94a3b8" font-size="8" text-anchor="middle">10.0%</text>
        <text x="110" y="272" fill="#e2e8f0" font-size="10" text-anchor="middle">Max P95: 26.4 ms</text>
      </g>
    </svg>