<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="400" style="background:#0f172a; font-family:sans-serif;">
      <text x="480" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">P8: Range Tombstone Pressure Flush Oracle Validation</text>
      
      <!-- Panel 1: Phase C Scan Cost (μs/key) Comparison -->
      <g transform="translate(50, 60)">
        <rect width="410" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="205" y="25" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Phase C Scan Cost (μs/key) [Post-Flush Phase]</text>
        <line x1="30" y1="250" x2="380" y2="250" stroke="#64748b"/>
        
        <!-- Legend -->
        <rect x="110" y="45" width="15" height="10" fill="#ef4444" rx="2"/>
        <text x="130" y="54" fill="#e2e8f0" font-size="10">Default (No Flush)</text>
        <rect x="240" y="45" width="15" height="10" fill="#10b981" rx="2"/>
        <text x="260" y="54" fill="#e2e8f0" font-size="10">Oracle Flush</text>

        <!-- Pair 2.0% -->
        <rect x="60" y="250.0" width="35" height="0.0" fill="#ef4444" rx="3"/>
        <text x="77" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0</text>

        <rect x="100" y="250.0" width="35" height="0.0" fill="#10b981" rx="3"/>
        <text x="117" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0</text>

        <text x="97" y="270" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">2.0%</text>
        
        <!-- Pair 5.0% -->
        <rect x="170" y="250.0" width="35" height="0.0" fill="#ef4444" rx="3"/>
        <text x="187" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0</text>

        <rect x="210" y="250.0" width="35" height="0.0" fill="#10b981" rx="3"/>
        <text x="227" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0</text>

        <text x="207" y="270" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">5.0%</text>
        
        <!-- Pair 10.0% -->
        <rect x="280" y="250.0" width="35" height="0.0" fill="#ef4444" rx="3"/>
        <text x="297" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0</text>

        <rect x="320" y="250.0" width="35" height="0.0" fill="#10b981" rx="3"/>
        <text x="337" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0</text>

        <text x="317" y="270" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">10.0%</text>
        
      </g>

      <!-- Panel 2: Phase C IOPS Comparison -->
      <g transform="translate(500, 60)">
        <rect width="410" height="300" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="205" y="25" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Phase C IOPS (kOps/s) [Post-Flush Recovery]</text>
        <line x1="30" y1="250" x2="380" y2="250" stroke="#64748b"/>
        
        <!-- Legend -->
        <rect x="110" y="45" width="15" height="10" fill="#ef4444" rx="2"/>
        <text x="130" y="54" fill="#e2e8f0" font-size="10">Default (No Flush)</text>
        <rect x="240" y="45" width="15" height="10" fill="#10b981" rx="2"/>
        <text x="260" y="54" fill="#e2e8f0" font-size="10">Oracle Flush</text>

        <!-- Pair 2.0% -->
        <rect x="60" y="250.0" width="35" height="0.0" fill="#ef4444" rx="3"/>
        <text x="77" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0k</text>

        <rect x="100" y="250.0" width="35" height="0.0" fill="#10b981" rx="3"/>
        <text x="117" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0k</text>

        <text x="97" y="270" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">2.0%</text>
        
        <!-- Pair 5.0% -->
        <rect x="170" y="250.0" width="35" height="0.0" fill="#ef4444" rx="3"/>
        <text x="187" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0k</text>

        <rect x="210" y="250.0" width="35" height="0.0" fill="#10b981" rx="3"/>
        <text x="227" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0k</text>

        <text x="207" y="270" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">5.0%</text>
        
        <!-- Pair 10.0% -->
        <rect x="280" y="250.0" width="35" height="0.0" fill="#ef4444" rx="3"/>
        <text x="297" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0k</text>

        <rect x="320" y="250.0" width="35" height="0.0" fill="#10b981" rx="3"/>
        <text x="337" y="240.0" fill="#f8fafc" font-size="9" text-anchor="middle">0.0k</text>

        <text x="317" y="270" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">10.0%</text>
        
      </g>
    </svg>