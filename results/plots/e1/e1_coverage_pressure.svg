<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360" style="background:#0f172a; font-family:sans-serif;">
      <text x="450" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">E1: Range Tombstone Coverage Span vs Scan Cost & Keys Dropped</text>
      
      <!-- Panel 1: Scan Cost (μs/key) -->
      <g transform="translate(50, 60)">
        <rect width="380" height="260" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="190" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Scan Cost (μs/key) vs Span</text>
        <line x1="30" y1="200" x2="350" y2="200" stroke="#64748b"/>

        <rect x="60" y="60.0" width="50" height="140.0" fill="#38bdf8" rx="3"/>
        <text x="85" y="52.0" fill="#f8fafc" font-size="10" text-anchor="middle">229.7</text>
        <text x="85" y="220" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Span 10 (~1%)</text>
        
        <rect x="165" y="60.0" width="50" height="140.0" fill="#38bdf8" rx="3"/>
        <text x="190" y="52.0" fill="#f8fafc" font-size="10" text-anchor="middle">226.3</text>
        <text x="190" y="220" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Span 100 (~10%)</text>
        
        <rect x="270" y="60.0" width="50" height="140.0" fill="#38bdf8" rx="3"/>
        <text x="295" y="52.0" fill="#f8fafc" font-size="10" text-anchor="middle">224.5</text>
        <text x="295" y="220" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Span 400 (~40%)</text>
        
      </g>

      <!-- Panel 2: Physically Dropped Keys -->
      <g transform="translate(470, 60)">
        <rect width="380" height="260" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="190" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Compaction Key Drop Count vs Span</text>
        <line x1="30" y1="200" x2="350" y2="200" stroke="#64748b"/>

        <rect x="60" y="200.0" width="50" height="0.0" fill="#10b981" rx="3"/>
        <text x="85" y="192.0" fill="#f8fafc" font-size="10" text-anchor="middle">0</text>
        <text x="85" y="220" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Span 10 (~1%)</text>
        
        <rect x="165" y="200.0" width="50" height="0.0" fill="#10b981" rx="3"/>
        <text x="190" y="192.0" fill="#f8fafc" font-size="10" text-anchor="middle">0</text>
        <text x="190" y="220" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Span 100 (~10%)</text>
        
        <rect x="270" y="200.0" width="50" height="0.0" fill="#10b981" rx="3"/>
        <text x="295" y="192.0" fill="#f8fafc" font-size="10" text-anchor="middle">0</text>
        <text x="295" y="220" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Span 400 (~40%)</text>
        
      </g>
    </svg>