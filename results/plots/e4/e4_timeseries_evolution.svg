<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360" style="background:#0f172a; font-family:sans-serif;">
      <text x="450" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">E4: Time Series & Causality Boundary (1-Second Resolution)</text>
      
      <!-- Panel 1: Scan Cost (μs/key) vs Time -->
      <g transform="translate(50, 60)">
        <rect width="380" height="260" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="190" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Scan Cost (μs/key) vs Time (s)</text>
        <line x1="30" y1="200" x2="370" y2="200" stroke="#64748b"/>
        <line x1="30" y1="40" x2="30" y2="200" stroke="#64748b"/>
        <polyline fill="none" stroke="#ef4444" stroke-width="2" points="47.0,192.3 64.0,187.2 81.0,185.1 98.0,178.3 115.0,160.8"/><polyline fill="none" stroke="#10b981" stroke-width="2" points="47.0,191.9 64.0,158.9"/><polyline fill="none" stroke="#38bdf8" stroke-width="2" points="47.0,186.9 64.0,164.2 81.0,125.2 98.0,40.0"/>
        
        <!-- Legend -->
        <circle cx="40" cy="235" r="4" fill="#ef4444"/><text x="48" y="238" fill="#e2e8f0" font-size="9">T=64 (Aggressive)</text><circle cx="155" cy="235" r="4" fill="#10b981"/><text x="163" y="238" fill="#e2e8f0" font-size="9">T=256 (Medium)</text><circle cx="270" cy="235" r="4" fill="#38bdf8"/><text x="278" y="238" fill="#e2e8f0" font-size="9">T=1024 (Conservative)</text>
      </g>

      <!-- Panel 2: Active MemTable Size (MB) vs Time -->
      <g transform="translate(470, 60)">
        <rect width="380" height="260" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="190" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Active MemTable Size (MB) vs Time (s)</text>
        <line x1="30" y1="200" x2="370" y2="200" stroke="#64748b"/>
        <line x1="30" y1="40" x2="30" y2="200" stroke="#64748b"/>
        <polyline fill="none" stroke="#ef4444" stroke-width="2" points="47.0,197.5 64.0,198.3 81.0,195.8 98.0,197.5 115.0,196.7"/><polyline fill="none" stroke="#10b981" stroke-width="2" points="47.0,195.8 64.0,195.0"/><polyline fill="none" stroke="#38bdf8" stroke-width="2" points="47.0,197.5 64.0,196.7 81.0,195.8 98.0,196.2"/>
        
        <!-- Legend -->
        <circle cx="40" cy="235" r="4" fill="#ef4444"/><text x="48" y="238" fill="#e2e8f0" font-size="9">T=64 (Aggressive)</text><circle cx="155" cy="235" r="4" fill="#10b981"/><text x="163" y="238" fill="#e2e8f0" font-size="9">T=256 (Medium)</text><circle cx="270" cy="235" r="4" fill="#38bdf8"/><text x="278" y="238" fill="#e2e8f0" font-size="9">T=1024 (Conservative)</text>
      </g>
    </svg>